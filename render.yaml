services:
  - type: web
    name: ami-qr-system
    env: node
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: RENDER_DISK_MOUNT
        value: /data
    disk:
      name: ami-data
      mountPath: /data
      sizeGB: 1
